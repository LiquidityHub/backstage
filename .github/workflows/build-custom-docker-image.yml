name: Build and push custom Backstage image

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build-custom-docker-image.yml'
      - '.dockerignore'
      - 'app-config*.yaml'
      - 'packages/app/**'
      - 'packages/backend/**'
      - 'packages/**'
      - 'plugins/**'
      - 'yarn.lock'
      - 'package.json'
      - '.yarn/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/backstage-custom:latest
            ghcr.io/${{ github.repository_owner }}/backstage-custom:${{ github.sha }}
